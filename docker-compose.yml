version: "3.7"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - radovan-network

  flask_api:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build: ./api
    container_name: radovan_api
    restart: always
    environment:
      FLASK_DEBUG: 1
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: UTF-8
    env_file:
      - api/app/.env
    volumes:
      - ./api:/app
    ports:
      - "9003:9003"
    networks:
      - radovan-network
 
  flask_iface:
    build: ./iface
    container_name: radovan_iface
    restart: always
    env_file:
      - iface/.env
    environment:
      FLASK_DEBUG: 1
      FLASK_APP: ./iface/app.py
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: UTF-8
    volumes:
      - ./iface/app:/app
    ports:
      - "9090:9090"
    networks:
      - radovan-network

networks:
  radovan-network:
    external: true
